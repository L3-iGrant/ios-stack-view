name: StackViewSample
options:
  bundleIdPrefix: io.igrant.stackview
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  StackView:
    path: ../
targets:
  StackViewSample:
    type: application
    platform: iOS
    sources:
      - StackViewSample
    dependencies:
      - package: StackView
        product: StackView
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.igrant.stackview.sample
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
